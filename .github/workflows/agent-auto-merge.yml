name: agent-auto-merge

# Risk-routed autonomy boundary. Hermes opens the PR and proposes a risk label;
# this workflow (server-side, not the agent) decides routing. Auto-merge is only
# ENABLED here - GitHub still completes the merge only when branch protection
# required checks pass. Medium/high risk is routed to a human.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  route:
    name: Route by risk
    runs-on: ubuntu-latest
    # Only act on agent-authored PRs to avoid touching human PRs.
    if: contains(github.event.pull_request.labels.*.name, 'agent:in-progress') || contains(join(github.event.pull_request.labels.*.name), 'risk:')
    steps:
      - name: Decide route
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            const isLow = labels.includes('risk:low');
            const needsHuman = labels.includes('agent:needs-human');
            const route = isLow && !needsHuman ? 'auto' : 'human';
            core.setOutput('route', route);
            core.info(`labels=${labels.join(',')} route=${route}`);

      - name: Enable auto-merge (low risk)
        if: steps.decide.outputs.route == 'auto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --auto --repo "${{ github.repository }}"

      - name: Route to human (medium/high risk)
        if: steps.decide.outputs.route == 'human'
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels: ['agent:needs-human'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: 'Routed to human review: risk is not low or `agent:needs-human` is set. A human must review and merge.',
            });
